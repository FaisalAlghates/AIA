name: Live demo (GitHub Pages)

# A static snapshot of the running app: CI boots Laravel on SQLite with its seeders, crawls the public pages and publishes them.
# https://faisalalghates.github.io/AIA/  (read-only: forms and live components do not work in the snapshot)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite, sqlite3, gd, zip, bcmath, fileinfo, exif
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Boot the app on SQLite with seeded data
        run: |
          cp .env.example .env
          php artisan key:generate --force
          mkdir -p database && touch database/database.sqlite
          sed -i 's/^APP_ENV=.*/APP_ENV=production/; s/^APP_DEBUG=.*/APP_DEBUG=false/; s#^APP_URL=.*#APP_URL=http://127.0.0.1:8000#' .env
          php artisan migrate --force --seed
          php artisan storage:link || true
      - name: Crawl the pages
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > serve.log 2>&1 &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8000/ >/dev/null && break; sleep 1; done
          mkdir -p site
          wget --mirror --page-requisites --adjust-extension --convert-links --no-host-directories --no-parent \
            --restrict-file-names=windows -e robots=off --level=3 --tries=2 --timeout=20 \
            --reject-regex '(logout|/delete|/destroy|livewire/update|/api/|/edit|/create)' \
            -P site \
            http://127.0.0.1:8000/ http://127.0.0.1:8000/admin http://127.0.0.1:8000/solutions http://127.0.0.1:8000/services \
            http://127.0.0.1:8000/team http://127.0.0.1:8000/portfolio http://127.0.0.1:8000/blog http://127.0.0.1:8000/documentation \
            http://127.0.0.1:8000/resources http://127.0.0.1:8000/faq http://127.0.0.1:8000/pricing http://127.0.0.1:8000/analytics \
            http://127.0.0.1:8000/support http://127.0.0.1:8000/legal || true
          test -f site/index.html || { echo "no home page was captured"; tail -50 serve.log; exit 1; }
          # a note at the top of every page, and no leftover absolute links to the local server
          find site -name '*.html' -print0 | xargs -0 sed -i 's#<body\([^>]*\)>#<body\1><div style="background:\#2a2208;color:\#f3d98b;padding:8px 16px;font:14px/1.4 system-ui,sans-serif;text-align:center">Static demo snapshot: forms and live components are switched off.</div>#; s#http://127.0.0.1:8000/#./#g'
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
